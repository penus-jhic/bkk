services:
  bkk:
    build: .
    container_name: bkk
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web-penus-network

  postgres:
    image: postgres:17
    container_name: db-bkk
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web-penus-network      

  postgrest:
    image: postgrest/postgrest
    container_name: rest-bkk
    environment:
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_DB_URI: postgres://postgres:${DB_PASSWORD}@db-bkk:5432/${DB_DATABASE}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:3000
      PGRST_DB_ANON_ROLE: postgres
    depends_on:
      - postgres
    networks:
      - web-penus-network  
      
volumes:
  pgdata:

networks:
  web-penus-network:
    external: true
