services:
  # nginx publik; tetap bernama "bkk" port 80 supaya reverse proxy di web-penus-network tidak perlu diubah
  bkk:
    image: nginx:1.28-alpine
    container_name: bkk
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bkk-app
    networks:
      - web-penus-network

  # Laravel di php-fpm (port 9000, hanya untuk nginx), user www-data, filesystem read-only
  bkk-app:
    build: .
    container_name: bkk-app
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
      - /var/www/html/bootstrap/cache:uid=82,gid=82
    volumes:
      - bkk-storage:/var/www/html/storage
      - bkk-uploads:/var/www/html/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web-penus-network

  postgres:
    image: postgres:17
    container_name: db-bkk
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - web-penus-network      

  postgrest:
    image: postgrest/postgrest
    environment:
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_DB_URI: postgres://postgres:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:3000
      PGRST_DB_ANON_ROLE: postgres
    depends_on:
      - postgres
    networks:
      - web-penus-network  
      
volumes:
  pgdata:
  bkk-storage:
  bkk-uploads:

networks:
  web-penus-network:
    external: true
