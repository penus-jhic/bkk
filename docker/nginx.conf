# nginx di depan php-fpm. Semua aset (/bkk/build, /bkk/images, /bkk/uploads, /bkk/storage)
# sudah dilayani lewat route Laravel (StaticAssetController), jadi semua request diteruskan ke index.php.
server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include fastcgi_params;
        fastcgi_pass bkk-app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 60s;
    }
}
